  <circle cx="24.5" cy="21.8" r="1.2" fill="#fbbf24"/>
  
  <!-- AI Sparkle in top right corner -->
  <path d="M25 3.5 L25.7 5.2 L27.4 6 L25.7 6.8 L25 8.5 L24.3 6.8 L22.6 6 L24.3 5.2 Z" fill="#38bdf8"/>
